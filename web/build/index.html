    <!-- ⚠️ An empty inline icon, not a file. With no <link rel="icon"> the browser asks for

         icon, so the cheapest correct answer is to satisfy the request with nothing. -->

         package the loading screen and the pause menu are drawn from. Linked at RUNTIME, never
         imported from src/: Vite would try to bundle the https://cfx-nui-* URLs inside it. The
         faces come from here too; the bundle declares none of its own. -->
